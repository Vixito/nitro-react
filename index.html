<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" crossorigin="use-credentials" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#000000">
    <meta name="apple-mobile-web-app-title" content="Nitro">
    <meta name="application-name" content="Nitro">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <base href="/game/">
    <title>Nitro</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" class="w-100 h-100"></div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var fromQuery = params.get('sso');
        var fromCookie = null;
        var m = document.cookie.match(/(?:^|; )habbten_sso=([^;]*)/);
        if (m) {
          try { fromCookie = decodeURIComponent(m[1]); } catch (e) { fromCookie = m[1]; }
          document.cookie = 'habbten_sso=; Max-Age=0; Path=/game';
        }
        var ticket = fromQuery || fromCookie || null;
        var path = window.location.pathname || '';
        var gamePrefix = path.indexOf('/game') === 0 ? '/game' : '';
        var origin = window.location.origin;
        var proto = window.location.protocol;
        var host = window.location.host;
        var wsProto = proto === 'https:' ? 'wss:' : 'ws:';
        var cfg = {
          'config.urls': gamePrefix
            ? [ origin + gamePrefix + '/renderer-config.json', origin + gamePrefix + '/ui-config.json' ]
            : [ '/renderer-config.json', '/ui-config.json' ],
          'sso.ticket': ticket,
          'forward.type': (params.get('room') ? 2 : -1),
          'forward.id': (params.get('room') || 0),
          'friend.id': (params.get('friend') || 0),
        };
        if (gamePrefix) {
          var root = origin + gamePrefix;
          cfg['socket.url'] = wsProto + '//' + host + gamePrefix + '/ws';
          cfg['asset.url'] = root + '/assets';
          cfg['image.library.url'] = root + '/swf/c_images/';
          cfg['hof.furni.url'] = root + '/swf/dcr/hof_furni';
        }
        window.NitroConfig = cfg;
      })();
    </script>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
