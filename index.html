<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" crossorigin="use-credentials" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#000000">
    <meta name="apple-mobile-web-app-title" content="Habbten">
    <meta name="application-name" content="Habbten">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <base href="/game/">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Habbten Hotel</title>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para jugar en Habbten.</noscript>
    <div id="root" class="w-100 h-100"></div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var pathLower = (window.location.pathname || '').toLowerCase();
        var isAppClientPath = pathLower.indexOf('/game/mobile') === 0 || pathLower.indexOf('/mobile') === 0 || typeof window.HabbtenNative !== 'undefined' || /HabbtenMobileApp/i.test(navigator.userAgent || '');
        if (!isAppClientPath) {
          try {
            if (window.parent && window.parent !== window && (window.parent.location.pathname || '').toLowerCase().indexOf('/app') === 0) {
              isAppClientPath = true;
            }
          } catch (e) {}
        }
        var isStandalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
        var isCoarseMob = window.matchMedia && window.matchMedia('(pointer: coarse)').matches && window.innerWidth <= 1024;
        var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent || '');
        var isMobileBoot = isAppClientPath || isStandalone || window.innerWidth <= 860 || ((isCoarseMob || isMobileUA) && (window.innerWidth <= 1024 || window.innerHeight <= 560));

        if (isMobileBoot) {
          document.body.dataset.era = 'mobile';
          document.body.classList.remove('era-modern', 'era-flash-2012', 'era-shockwave-2006');
          document.body.classList.add('is-mobile-ui');
        } else {
          var eraParam = params.get('era');
          var eraStorage = null;
          try { eraStorage = localStorage.getItem('habbten_theme_era'); } catch (e) {}
          var eraCookieMatch = document.cookie.match(/(?:^|; )habbten_era=([^;]*)/);
          var eraCookie = eraCookieMatch ? decodeURIComponent(eraCookieMatch[1]) : null;
          var chosenEra = eraParam || eraCookie || eraStorage || 'modern';
          if (chosenEra === 'shockwave2006' || chosenEra === 'flash2012' || chosenEra === 'modern') {
            try { localStorage.setItem('habbten_theme_era', chosenEra); } catch (e) {}
            document.body.dataset.era = chosenEra;
            document.body.classList.remove('era-modern', 'era-flash-2012', 'era-shockwave-2006', 'is-mobile-ui');
            if (chosenEra === 'shockwave2006') document.body.classList.add('era-shockwave-2006');
            else if (chosenEra === 'flash2012') document.body.classList.add('era-flash-2012');
            else document.body.classList.add('era-modern');
          }
        }

        var fromQuery = params.get('sso');
        var fromCookie = null;
        var m = document.cookie.match(/(?:^|; )habbten_sso=([^;]*)/);
        if (m) {
          try { fromCookie = decodeURIComponent(m[1]); } catch (e) { fromCookie = m[1]; }
        }
        var ticket = fromQuery || fromCookie || null;
        try { sessionStorage.removeItem('habbten_sso'); } catch (e) {}
        var path = window.location.pathname || '';
        var gamePrefix = path.indexOf('/game') === 0 ? '/game' : '';
        var origin = window.location.origin;
        var proto = window.location.protocol;
        var host = window.location.host;
        var wsProto = proto === 'https:' ? 'wss:' : 'ws:';
        var cfg = {
          'config.urls': gamePrefix
            ? [ origin + gamePrefix + '/renderer-config.json', origin + gamePrefix + '/ui-config.json' ]
            : [ '/renderer-config.json', '/ui-config.json' ],
          'sso.ticket': ticket,
          'forward.type': (params.get('room') ? 2 : -1),
          'forward.id': (params.get('room') || 0),
          'friend.id': (params.get('friend') || 0),
        };
        if (gamePrefix) {
          var root = origin + gamePrefix;
          cfg['socket.url'] = wsProto + '//' + host + gamePrefix + '/ws';
          cfg['asset.url'] = root + '/assets';
          cfg['image.library.url'] = root + '/swf/c_images/';
          cfg['hof.furni.url'] = root + '/swf/dcr/hof_furni';
          cfg['furnidata.url'] = root + '/assets/gamedata/FurnitureData.json?v=20260821_v14';
          cfg['productdata.url'] = root + '/assets/gamedata/ProductData.json?v=20260821_v14';
        }
        Object.defineProperty(window, 'NitroConfig', {
          value: cfg,
          writable: true,
          enumerable: false,
          configurable: true
        });
        if (document.currentScript) document.currentScript.remove();
      })();
    </script>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
